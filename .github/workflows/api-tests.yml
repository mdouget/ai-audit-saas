name: API checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auditdev
          POSTGRES_PASSWORD: local-only-change-me
          POSTGRES_DB: ai_assurance
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U auditdev -d ai_assurance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: apps/api
      TEST_MIGRATION_DATABASE_URL: postgresql://auditdev:local-only-change-me@127.0.0.1:5432/ai_assurance
      TEST_DATABASE_URL: postgresql://assurance_app:local-runtime-only@127.0.0.1:5432/ai_assurance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: psql "$TEST_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/dev/runtime-role.sql
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m pytest -q apps/api/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
