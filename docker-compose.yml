services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditdev
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: ai_assurance
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./apps/api/dev/runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auditdev -d ai_assurance"]
      interval: 5s
      retries: 5
  migrate:
    build: ./apps/api
    command: ["python", "-m", "app.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://auditdev:local-only-change-me@database:5432/ai_assurance
    depends_on:
      database:
        condition: service_healthy
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://assurance_app:local-runtime-only@database:5432/ai_assurance
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./apps/web
    environment:
      INTERNAL_API_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  database-data:
