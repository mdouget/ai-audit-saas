services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditdev
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: ai_assurance
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditdev"]
      interval: 5s
      retries: 5
  api:
    build: ./apps/api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      database:
        condition: service_healthy
  web:
    build: ./apps/web
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
